# Server Configuration
server.port=8080

# Application Name
spring.application.name=Bad API Challenge

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SpringDoc/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Bad Behavior Configuration
badapi.random-error.failure-rate=0.35
badapi.rate-limit.requests-per-minute=30
badapi.rate-limit.window-seconds=60
badapi.pagination.page-size=100

# Network Chaos Configuration (Tuned for ~2 minute completion time)
badapi.chaos.random-slowness-enabled=true
badapi.chaos.slowness-probability=0.3
badapi.chaos.min-delay-seconds=1
badapi.chaos.max-delay-seconds=3
badapi.chaos.timeout-probability=0.05

# Rate Limit Chaos (makes rate limiting unpredictable)
badapi.chaos.variable-rate-limit=true
badapi.chaos.min-rate-limit=20
badapi.chaos.max-rate-limit=60

# Admin key for POST /api/reset - override with the BADAPI_ADMIN_KEY env var
# for any deployment reachable outside localhost. Defaulting to "reset123"
# only for local dev convenience.
badapi.admin-key=${BADAPI_ADMIN_KEY:reset123}

# Logging - see logback-spring.xml for output pattern, console/file appenders,
# and rotation policy
logging.level.com.challenge.badapi=INFO

